<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investigator Portal | CIIS</title>
    <link rel="stylesheet" href="/static/investigator/home/home.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="nav-brand">
                <span>🕵️</span>
                <h1>CIIS Investigator Portal</h1>
            </div>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h2 id="welcomeHeading">My Dashboard</h2>
            <p id="welcomeMsg">Review and manage your active investigations.</p>
        </header>

        <div class="dashboard-grid">
            <a href="/my-cases" class="inv-card">
                <div class="card-icon">📂</div>
                <h3>My Active Cases</h3>
                <p>View all incidents assigned to you and update their status.</p>
            </a>
            <a href="/investigator/profile" class="inv-card">
                <div class="card-icon">👤</div>
                <h3>Profile</h3>
                <p>View your professional credentials and case summary.</p>
            </a>
        </div>
    </main>

    <script src="/static/investigator/home/home.js" defer></script>
</body>
</html>
