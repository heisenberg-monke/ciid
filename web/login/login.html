<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - CIIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/login/login.css">
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Campus Incident System</h1>
        
        <!-- Tabs -->
        <div class="flex border-b mb-6">
            <button id="tabLogin" class="flex-1 py-2 text-center font-semibold border-b-2 border-blue-600 text-blue-600">Login</button>
            <button id="tabSignup" class="flex-1 py-2 text-center font-semibold border-b-2 border-transparent text-gray-500">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <input type="email" id="loginEmail" placeholder="Email Address" required class="w-full border p-2 rounded">
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-semibold">Login</button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="space-y-4 hidden">
            <input type="text" id="signupName" placeholder="Full Name" required class="w-full border p-2 rounded">
            <input type="email" id="signupEmail" placeholder="Email Address" required class="w-full border p-2 rounded">
            <input type="text" id="signupPhone" placeholder="Phone Number" class="w-full border p-2 rounded">
            <input type="text" id="signupDepartment" placeholder="Department" required class="w-full border p-2 rounded">
            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700 font-semibold">Create Account</button>
        </form>
    </div>
    <script src="/static/login/login.js"></script>
</body>
</html>
