<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students | CIIS Admin</title>
    <link rel="stylesheet" href="/static/admin/students/students.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/admin-home" class="nav-link">
                <span>⬅️</span>
                <span>Back to Dashboard</span>
            </a>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h1>Student Management</h1>
            <p>Manage student accounts and academic affiliations.</p>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th class="action-cell">Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="/static/admin/students/students.js" defer></script>
</body>
</html>
