<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Incidents | CIIS Admin</title>
    <link rel="stylesheet" href="/static/admin/incidents/incidents.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/admin-home" class="nav-link">
                <span>⬅️</span>
                <span>Back to Dashboard</span>
            </a>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h1>Incident Assignment</h1>
            <p>Triaging reported incidents and assigning investigators.</p>
        </header>

        <!-- Accordion Filter Bar -->
        <div class="filter-bar">

            <!-- Severity column -->
            <div class="filter-col" id="col-severity">
                <button class="filter-col-trigger" aria-expanded="false" aria-controls="panel-severity">
                    <span class="col-label">Severity</span>
                    <span class="col-caret">▾</span>
                </button>
                <div class="filter-col-panel" id="panel-severity" hidden>
                    <div class="severity-checkboxes">
                        <label class="checkbox-label"><input type="checkbox" value="Low" checked> Low</label>
                        <label class="checkbox-label"><input type="checkbox" value="Medium" checked> Medium</label>
                        <label class="checkbox-label"><input type="checkbox" value="High" checked> High</label>
                        <label class="checkbox-label"><input type="checkbox" value="Critical" checked> Critical</label>
                    </div>
                </div>
            </div>

            <!-- Date column -->
            <div class="filter-col" id="col-date">
                <button class="filter-col-trigger" aria-expanded="false" aria-controls="panel-date">
                    <span class="col-label">Date Range</span>
                    <span class="col-caret">▾</span>
                </button>
                <div class="filter-col-panel" id="panel-date" hidden>
                    <div class="date-slider-container">
                        <div class="slider-labels">
                            <span id="minDateLabel">Min Date</span>
                            <span id="maxDateLabel">Max Date</span>
                        </div>
                        <div class="dual-slider-container" id="sliderContainer">
                            <div class="slider-track-highlight" id="sliderTrackHighlight"></div>
                            <input type="range" id="minDateSlider" min="0" max="100" value="0" class="date-slider">
                            <input type="range" id="maxDateSlider" min="0" max="100" value="100" class="date-slider">
                        </div>
                        <div class="date-inputs">
                            <div class="date-input-wrapper">
                                <input type="text" id="minDate" placeholder="YYYY/MM/DD" maxlength="10">
                                <button type="button" class="date-cal-btn" id="minDateCalBtn" title="Pick min date">📅</button>
                                <input type="date" id="minDateNative" class="native-date-hidden" tabindex="-1">
                            </div>
                            <span class="date-sep">to</span>
                            <div class="date-input-wrapper">
                                <input type="text" id="maxDate" placeholder="YYYY/MM/DD" maxlength="10">
                                <button type="button" class="date-cal-btn" id="maxDateCalBtn" title="Pick max date">📅</button>
                                <input type="date" id="maxDateNative" class="native-date-hidden" tabindex="-1">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Investigator column -->
            <div class="filter-col" id="col-investigator">
                <button class="filter-col-trigger" aria-expanded="false" aria-controls="panel-investigator">
                    <span class="col-label">Investigator</span>
                    <span class="col-caret">▾</span>
                </button>
                <div class="filter-col-panel" id="panel-investigator" hidden>
                    <div class="investigator-checkboxes" id="investigatorCheckboxes">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

        </div>

        <div class="table-container">
            <table id="incidentsTable">
                <thead>
                    <tr>
                        <th class="sortable" data-sort="incident_id">ID <span class="sort-indicator">↕</span></th>
                        <th class="sortable" data-sort="incident_date">Date <span class="sort-indicator">↕</span></th>
                        <th>Description</th>
                        <th class="sortable" data-sort="severity">Severity <span class="sort-indicator">↕</span></th>
                        <th>Investigator</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="incidentTableBody">
                    <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="/static/core/core.js"></script>
    <script src="/static/admin/incidents/incidents.js" defer></script>
</body>
</html>
