<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | CIIS</title>
    <link rel="stylesheet" href="/static/student/home/home.css?v=2">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="nav-brand">
                <span>🎓</span>
                <h1>CIIS Student Portal</h1>
            </div>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h2 id="welcomeHeading">My Dashboard</h2>
            <p id="welcomeMsg">Report and track campus incidents.</p>
        </header>

        <div class="dashboard-grid">
            <a href="/incident" class="student-card">
                <div class="card-icon">🚨</div>
                <h3>Report Incident</h3>
                <p>Submit a new report about a campus event.</p>
            </a>
            <a href="/my-incidents" class="student-card">
                <div class="card-icon">📋</div>
                <h3>My Reports</h3>
                <p>Track the status of your reported incidents.</p>
            </a>
            <a href="/profile" class="student-card">
                <div class="card-icon">👤</div>
                <h3>Profile</h3>
                <p>Manage your personal and academic information.</p>
            </a>
        </div>
    </main>

    <script src="/static/student/home/home.js?v=2" defer></script>
</body>
</html>
