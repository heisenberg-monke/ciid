<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home | CIIS</title>
    <link rel="stylesheet" href="/static/core/core.css">
    <link rel="stylesheet" href="/static/student/home/home.css">
</head>
<body>
    <div class="page-shell">
        <header class="header">
            <div>
                <h1>Student Portal</h1>
                <p>Welcome back to the Campus Incident Information System.</p>
            </div>
            <button id="logoutBtn" class="btn-danger">Logout</button>
        </header>

        <div class="card-grid">
            <a href="/incident" class="home-card">
                <div class="card-icon">🚨</div>
                <h3>Report Incident</h3>
                <p>Submit a new report about a campus event.</p>
            </a>
            <a href="/my-incidents" class="home-card">
                <div class="card-icon">📋</div>
                <h3>My Reports</h3>
                <p>Track the status of your reported incidents.</p>
            </a>
            <a href="/profile" class="home-card">
                <div class="card-icon">👤</div>
                <h3>Profile</h3>
                <p>Manage your personal and academic information.</p>
            </a>
        </div>
    </div>

    <script src="/static/core/core.js"></script>
    <script src="/static/student/home/home.js" defer></script>
</body>
</html>
