<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Incident - CIIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/incident/incident.css">
</head>
<body class="p-8">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Report an Incident</h1>
            <button id="backBtn" class="text-blue-600 hover:underline font-semibold">&larr; Back to Menu</button>
        </div>

        <form id="incidentForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                <select id="incidentCategory" required class="w-full border p-2 rounded bg-white">
                    <option value="">Select Category</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                <select id="incidentLocation" required class="w-full border p-2 rounded bg-white">
                    <option value="">Select Location</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Incident Date & Time</label>
                    <input type="datetime-local" id="incidentDate" required class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Severity</label>
                    <select id="incidentSeverity" required class="w-full border p-2 rounded bg-white">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea id="incidentDescription" rows="4" placeholder="Provide details of the incident..." required class="w-full border p-2 rounded"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-semibold">Submit Report</button>
        </form>
    </div>

    <script src="/static/incident/incident.js"></script>
</body>
</html>
