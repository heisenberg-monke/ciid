<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CIIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/home/home.css">
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Top Navigation Header -->
        <header class="flex justify-between items-center mb-10 bg-white p-4 rounded-lg shadow">
            <h1 class="text-xl font-bold text-gray-800">Campus Incident Menu</h1>
            <button id="accountBtn" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg font-semibold text-gray-700">Account Info</button>
        </header>

        <!-- Menu Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <button id="reportIncidentBtn" class="bg-blue-600 hover:bg-blue-700 text-white p-6 rounded-lg shadow font-semibold text-left transition transform hover:-translate-y-1">
                <h2 class="text-lg font-bold mb-1">Report an Incident</h2>
                <p class="text-sm text-blue-100">Submit a new campus incident report.</p>
            </button>
            <!-- Future Menu Buttons can go here -->
        </div>
    </div>

    <!-- Account Modal -->
    <div id="accountModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg w-96 shadow-lg">
            <h2 class="text-xl font-bold mb-4">Account Information</h2>
            <div class="space-y-2 text-gray-700 mb-6">
                <p><strong>Name:</strong> <span id="accName"></span></p>
                <p><strong>Email:</strong> <span id="accEmail"></span></p>
                <p><strong>Department:</strong> <span id="accDept"></span></p>
                <p><strong>Phone:</strong> <span id="accPhone"></span></p>
            </div>
            <div class="flex justify-between">
                <button id="logoutBtn" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Logout</button>
                <button id="closeModal" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">Close</button>
            </div>
        </div>
    </div>

    <script src="/static/home/home.js"></script>
</body>
</html>
